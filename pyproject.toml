[project]
name = "medical-research-agents"
version = "0.1.0"
description = "Multi-agent system for biomedical research and lecture analysis"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-groq>=1.0",
    "langchain-openai>=0.2",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "httpx>=0.27"
]

[project.optional-dependencies]
# Dependencies required only for local development and testing
dev = [
    "pytest>=8.0",
    "ruff>=0.5"
]

[tool.setuptools]
# Defines which directories are considered Python packages
packages = ["core", "agents"]

[tool.pytest.ini_options]
# Default directory for test execution
testpaths = ["tests"]

[tool.ruff]
# Linter and formatter configuration
line-length = 100
target-version = "py311"